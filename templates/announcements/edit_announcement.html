{% extends 'base.html' %}

{% block title %}Edit Announcement - Acadex{% endblock %}

{% block content %}
<a href="{% url 'announcements:my_announcements' %}" class="back-link">← Back to My Announcements</a>

<h1 style="font-size: 1.6rem; font-weight: 800; color: var(--silver-light); margin-bottom: 1.5rem;">Edit Announcement</h1>

<div class="form-section">
    <form method="post" id="announcementForm" novalidate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="title">Announcement Title <span style="color: var(--danger);">*</span></label>
            <input type="text" id="title" name="title" required value="{{ announcement.title }}">
            <span class="error-message" id="title_error"></span>
        </div>
        
        <div class="form-group">
            <label for="content">Content <span style="color: var(--danger);">*</span></label>
            <textarea id="content" name="content" rows="8" required>{{ announcement.content }}</textarea>
            <span class="error-message" id="content_error"></span>
        </div>
        
        <div class="form-group">
            <label>Announcement Type <span style="color: var(--danger);">*</span></label>
            <div class="radio-group">
                <div class="radio-option">
                    <input type="radio" id="type_system" name="announcement_type" value="system" {% if announcement.announcement_type == 'system' %}checked{% endif %} onchange="toggleSubjectField()">
                    <label for="type_system">System-wide (All students)</label>
                </div>
                <div class="radio-option">
                    <input type="radio" id="type_course" name="announcement_type" value="course" {% if announcement.announcement_type == 'course' %}checked{% endif %} onchange="toggleSubjectField()">
                    <label for="type_course">Course-specific (One subject only)</label>
                </div>
            </div>
        </div>
        
        <div class="form-group" id="subject_field" {% if announcement.announcement_type != 'course' %}style="display: none;"{% endif %}>
            <label for="subject">Select Subject <span style="color: var(--danger);">*</span></label>
            <select id="subject" name="subject">
                <option value="">-- Select a subject --</option>
                {% for subject in subjects %}
                    <option value="{{ subject.id }}" {% if announcement.subject and announcement.subject.id == subject.id %}selected{% endif %}>
                        {{ subject.code }} - {{ subject.name }}
                    </option>
                {% endfor %}
            </select>
            <span class="error-message" id="subject_error"></span>
        </div>
        
        <div class="form-group">
            <label class="checkbox-label">
                <input type="checkbox" name="is_active" {% if announcement.is_active %}checked{% endif %}>
                <span>Active (Visible to students)</span>
            </label>
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
            <button type="submit" class="btn-primary" style="flex: 1; padding: 0.75rem;">Update Announcement</button>
            <a href="{% url 'announcements:my_announcements' %}" class="btn-secondary" style="flex: 1; text-align: center; padding: 0.75rem; display: flex; align-items: center; justify-content: center;">Cancel</a>
        </div>
    </form>
</div>

<script>
function toggleSubjectField() {
    const courseRadio = document.getElementById('type_course');
    const subjectField = document.getElementById('subject_field');
    const subjectSelect = document.getElementById('subject');
    
    if (courseRadio.checked) {
        subjectField.style.display = 'block';
        subjectSelect.required = true;
    } else {
        subjectField.style.display = 'none';
        subjectSelect.required = false;
        subjectSelect.value = '';
    }
}

document.getElementById('announcementForm').addEventListener('submit', function(e) {
    e.preventDefault();
    let isValid = true;
    
    document.querySelectorAll('.error-message').forEach(err => { err.style.display = 'none'; err.textContent = ''; });
    document.querySelectorAll('input, textarea, select').forEach(input => input.classList.remove('error'));
    
    const title = document.getElementById('title');
    if (!title.value.trim()) {
        document.getElementById('title_error').textContent = 'Title is required';
        document.getElementById('title_error').style.display = 'block';
        title.classList.add('error');
        isValid = false;
    }
    
    const content = document.getElementById('content');
    if (!content.value.trim()) {
        document.getElementById('content_error').textContent = 'Content is required';
        document.getElementById('content_error').style.display = 'block';
        content.classList.add('error');
        isValid = false;
    }
    
    const courseRadio = document.getElementById('type_course');
    const subject = document.getElementById('subject');
    if (courseRadio.checked && !subject.value) {
        document.getElementById('subject_error').textContent = 'Please select a subject';
        document.getElementById('subject_error').style.display = 'block';
        subject.classList.add('error');
        isValid = false;
    }
    
    if (isValid) { this.submit(); }
});

['title', 'content', 'subject'].forEach(id => {
    const element = document.getElementById(id);
    if (element) {
        element.addEventListener('input', function() {
            const errorId = this.id + '_error';
            const errorElement = document.getElementById(errorId);
            if (errorElement && this.value.trim()) {
                errorElement.style.display = 'none';
                this.classList.remove('error');
            }
        });
    }
});
</script>
{% endblock %}
